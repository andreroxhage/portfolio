<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d"><title id="t">A cart that never checks out: the flow</title><desc id="d">How the cart gets filled, in four steps. A shopping list with two lines, Coriander, 2 pots and Sesame oil, 1 small bottle. For the sesame oil, a list of products: Sesame oil 500 ml, 250 ml and 100 ml, and Toasted sesame oil 250 ml. The 100 ml bottle is picked by its size and the others are dimmed. Then the question Shall I put everything in the Mathem cart now?, answered Yes. Last, the cart with four checked items, a locked, crossed-out Checkout button and the line: It never places the order.</desc><rect width="1920" height="1080" fill="#12100d"/><text x="120" y="131" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="48" font-weight="500" fill="#d6d4d0">3 · Fill the cart</text><rect x="261" y="244" width="678" height="252" rx="23" fill="#181612" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="2"/><text x="312" y="297" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="26" font-weight="500" fill="#d6d4d0">Shopping list</text><g transform="translate(312 340) scale(1.25)" fill="none" stroke="#d6d4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z"/></g><text x="354" y="366" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="400" fill="#f7f5f1">Coriander, 2 pots</text><line x1="302" y1="393.5" x2="898" y2="393.5" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="1"/><g transform="translate(312 416) scale(1.25)" fill="none" stroke="#d6d4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z"/></g><text x="354" y="442" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="400" fill="#f7f5f1">Sesame oil, 1 small bottle</text><rect x="289.5" y="394.5" width="621" height="73" rx="14" fill="none" stroke="#f7f5f1" stroke-width="3"/><g transform="translate(970 350) scale(1.66667)" fill="none" stroke="#d6d4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"/><path d="M13 18l6 -6"/><path d="M13 6l6 6"/></g><g transform="translate(1092 179) scale(1.25)" fill="none" stroke="#d6d4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z"/></g><text x="1134" y="205" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="400" fill="#f7f5f1">Sesame oil, 1 small bottle</text><rect x="1041" y="235" width="618" height="334" rx="23" fill="#181612" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="2"/><text x="1092" y="308.5" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="32" font-weight="400" fill="#f7f5f1" opacity="0.35">Sesame oil 500 ml</text><line x1="1082" y1="332.5" x2="1618" y2="332.5" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="1"/><text x="1092" y="378.5" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="32" font-weight="400" fill="#f7f5f1" opacity="0.35">Sesame oil 250 ml</text><line x1="1082" y1="402.5" x2="1618" y2="402.5" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="1"/><text x="1092" y="448.5" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="32" font-weight="400" fill="#f7f5f1">Sesame oil 100 ml</text><line x1="1082" y1="472.5" x2="1618" y2="472.5" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="1"/><text x="1092" y="518.5" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="32" font-weight="400" fill="#f7f5f1" opacity="0.35">Toasted sesame oil 250 ml</text><rect x="1069.5" y="403.5" width="561" height="67" rx="14" fill="none" stroke="#f7f5f1" stroke-width="3"/><circle