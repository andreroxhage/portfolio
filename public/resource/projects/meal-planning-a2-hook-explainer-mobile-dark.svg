<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d">
<title id="t">Write the recipes: before and after the recipe check</title>
<desc id="d">Before: Pour the milk over the breadcrumbs and let it soak for 10 minutes. recipe_guard.sh reports Error: the step uses &#39;milk&#39; without an amount. After: Pour 1.5 dl milk over 1 dl breadcrumbs and let it soak for 10 min. 0 errors. Caption: Strict rules guide the AI model, so the recipes are easy to read.</desc>
