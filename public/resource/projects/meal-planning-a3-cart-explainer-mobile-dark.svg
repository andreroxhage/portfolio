<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d"><title id="t">A cart that never checks out: the flow</title><desc id="d">How the cart gets filled, in four steps from top to bottom. A shopping list with two lines, Coriander, 2 pots and Sesame oil, 1 small bottle. For the sesame oil, a list of products where Sesame oil 100 ml is picked by its size and the 500 ml and 250 ml bottles are dimmed. Then the question Shall I put everything in the Mathem cart now?, answered Yes. Last, the cart with checked items, a locked, crossed-out Checkout button and the line: It never places the order.</desc><rect width="1080" height="1350" fill="#12100d"/><text x="60" y="100" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="48" font-weight="500" fill="#d6d4d0">3 · Fill the cart</text><rect x="61" y="141" width="958" height="226" rx="27" fill="#181612" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="2"/><text x="108" y="204" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="40" font-weight="500" fill="#d6d4d0">Shopping list</text><g transform="translate(108 230) scale(1.5)" fill="none" stroke="#d6d4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z"/></g><text x="156" y="262" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="40" font-weight="400" fill="#f7f5f1">Coriander, 2 pots</text><line x1="100" y1="280.5" x2="980" y2="280.5" stroke="#f7f5f1" stroke-opacity="0.1" stroke-width="1"/><g transform="translate(108 294) scale(1.5)" fill="none" stroke="#d6d4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z"/></g><text x="156" y="326" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="40" font-weight="400" fill="#f7f5f1">Sesame oi